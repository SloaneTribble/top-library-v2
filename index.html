<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beloved Books</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./javascript.js" defer></script>
</head>
<body>
  <div class="header-container">
    <h1 id="main-header">Beloved Books</h1>
  </div>
  
  <div class="button-container">
    <button id="newBookButton">Add book</button>
  </div>
  
  <div id="table-container"></div>

  <dialog id="newBookDialog">
    <h2 id="dialogTitle">Add a New Book</h2>
    <div id="clearFormButtonContainer"><button id="clearFormButton">Clear Form</button></div>
    <form id="newBookForm" action="">
      <p>
        <label for="title">
          Title:
          <input type="text" name="title" id="title" class="formInput">
        </label>

        <label for="author">
          Author:
          <input type="text" name="author" id="author" class="formInput">
        </label>

        <label for="pages">
          Number of Pages:
          <input type="number" name="pages" id="pages" class="formInput">
        </label>
        
        <label for="read">
          Have you read it yet?
          <input type="checkbox" name="read" id="read" class="formInput" checked>
        </label>
      </p>

      <div>
        <button value="cancel" formmethod="dialog">Cancel</button>
        <button id="confirmButton" value="default">Confirm</button>
      </div>
    </form>

  </dialog>

  <output></output>



      <footer class="footer">
      <p>
        Copyright ©
        <script>
          document.write(new Date().getFullYear());
        </script>
        Sloane Tribble
        <a href="https://github.com/sloanetribble" target="_blank">
        <img class="github-logo" src="./assets/github-mark.svg" />
      </a>
      </p>
    </footer>
</body>
</html>
